<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · Local AI Language Learning Instructor (LALLI)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1>🗣️ Local AI Language Learning Instructor</h1>
    <nav>
      <a href="index.html">Chat</a>
      <a href="progress.html">Progress</a>
      <a href="settings.html" class="active">Settings</a>
    </nav>
  </header>

  <section class="panel">
    <h2>Settings</h2>
    <div class="field-row">
      <label>AI bot voice
        <select id="voiceSelect">
          <option value="">Default (backend decides)</option>
        </select>
      </label>
    </div>
    <div class="field-row">
      <label>Speech speed
        <input id="speedSelect" type="range" min="0.5" max="1.5" step="0.05" value="1">
        <span id="speedValue">1.00x</span>
      </label>
    </div>
    <div class="settings-actions">
      <button id="testVoiceBtn" type="button">Test voice</button>
    </div>
    <div id="voiceHint" class="status" aria-live="polite">Loading available voices...</div>
  </section>

</div>

<script src="settings.js"></script>
</body>
</html>
